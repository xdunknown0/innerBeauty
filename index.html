<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6f4;--ink:#2a1020;--mut:#7a6070;--card:#fff;--line:#ecdcdc;--acc:#8e2457;--accink:#fff;--blush:#f3dfe2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c0e17;--ink:#f7e9ee;--mut:#b99aa8;--card:#2a1622;--line:#432636;--acc:#e0709f;--accink:#2a1020;--blush:#3a2030}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,sans-serif}
h1,h2,h3,.logo{font-family:'Cormorant Garamond',Georgia,serif;margin:0;line-height:1.1}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.logo{font-size:30px;font-weight:700;letter-spacing:.5px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.cartbtn{background:var(--acc);color:var(--accink);border:0;border-radius:99px;padding:9px 18px;font-weight:700}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:center;max-width:1100px;margin:0 auto;padding:40px 20px}
.hero h1{font-size:clamp(40px,7vw,76px);font-weight:600}
.hero p{color:var(--mut);max-width:42ch;font-size:18px}
.cta{display:inline-block;background:var(--acc);color:var(--accink);padding:13px 26px;border-radius:99px;text-decoration:none;font-weight:700;margin-top:8px}
.hero .imgs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .imgs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:140px 140px 12px 12px;background:var(--blush)}
.hero .imgs img+img{margin-top:36px;border-radius:12px 12px 140px 140px}
.info{background:var(--blush);text-align:center;padding:12px 20px;font-weight:500}
main{max-width:1100px;margin:0 auto;padding:36px 20px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 24px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 18px}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#fff}
.card div{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:22px}.card small{color:var(--mut)}
.old{color:var(--mut);font-weight:400;font-size:14px}.off{background:var(--blush);color:var(--acc);border-radius:6px;padding:2px 8px;font-size:13px;font-weight:700;align-self:flex-start}.price{font-weight:700;font-size:18px}
.row{display:flex;gap:8px;margin-top:auto}
select,input,textarea{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:9px;width:100%}
.row select{width:auto;align-self:center;padding:4px 6px;font-size:13px;border-radius:6px}.add{flex:1;background:var(--acc);color:var(--accink);border:0;border-radius:8px;font-weight:700}.card .add{padding:14px 18px;font-size:17px}
.drawer{position:fixed;inset:0 0 0 auto;width:min(420px,100%);background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s;z-index:10;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));overflow:auto}
.drawer.open{transform:none}
.item{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}
.item img{width:56px;height:56px;object-fit:cover;border-radius:8px}.item .t{flex:1;font-size:14px}
.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.sum div{display:flex;justify-content:space-between;padding:3px 0}.tot{font-weight:700;font-size:19px;border-top:1px solid var(--line);margin-top:6px;padding-top:8px!important}
form{display:grid;gap:8px;margin-top:12px}
.err{color:#d33;font-size:14px;min-height:18px}
.x{background:none;border:0;color:var(--ink);font-size:26px;align-self:flex-end}
.msgs{display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow:auto;padding:8px 0}.m{max-width:85%;padding:8px 12px;border-radius:14px;white-space:pre-wrap;font-size:14px;background:var(--blush)}.m.me{align-self:flex-end;background:var(--acc);color:var(--accink)}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:var(--card);display:grid;gap:8px}.st{font-weight:700;color:var(--acc)}.sh{max-width:100%;border-radius:8px}.ol{display:flex;gap:6px;flex-wrap:wrap}.ol button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px}
[hidden]{display:none!important}.drawer.wide{width:min(900px,100%)}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{display:block;font-size:28px;font-family:'Cormorant Garamond',serif}.ch{background:#0f1720;border-radius:10px;padding:8px}.ch svg{width:100%;height:auto}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);padding:20px;width:min(360px,92vw)}dialog::backdrop{background:#0008}#lf{display:grid;gap:10px}
footer{text-align:center;color:var(--mut);padding:30px 20px 40px;border-top:1px solid var(--line)}
@media(max-width:720px){.hero{grid-template-columns:1fr;padding:24px 14px;gap:18px}.hero .imgs img{border-radius:80px 80px 10px 10px}.hero .imgs img+img{margin-top:20px;border-radius:10px 10px 80px 80px}main{padding:24px 14px}main h2{font-size:32px!important}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.card div{padding:10px;gap:6px}.card h3{font-size:18px}.card .row{flex-direction:column}.card .row select{width:auto;min-width:76px;align-self:flex-start}.price{font-size:16px}header{padding:10px 12px;flex-wrap:wrap;gap:8px}.logo{font-size:26px}header>span:last-child{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.cartbtn{padding:8px 13px;font-size:14px}.tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.tabs button{white-space:nowrap}.q button{width:36px;height:36px}.x{padding:4px 10px}.drawer{width:100%;height:100dvh;padding-left:14px;padding-right:14px}.msgs{max-height:36dvh}.info{font-size:14px}}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.drawer{transition:none}}

const cats=["All","Panty","Combo","Bra","Set","Belt set"];let cat="All",cart=[];
const $=s=>document.querySelector(s),tk=n=>"৳"+n.toLocaleString("en-US");
function tabs(){$("#tabs").innerHTML=cats.map(c=>`<button aria-pressed="${c==cat}" data-c="${c}">${c}</button>`).join("")}
function grid(){$("#grid").innerHTML=P.filter(x=>cat=="All"||x.c==cat).map(x=>`<article class="card"><img src="${x.i}" alt="${x.n}" loading="lazy"><div><h3>${x.n}</h3><small>${x.c}</small><span class="price">${tk(x.p)} ${x.o?`<s class="old">${tk(x.o)}</s>`:""}</span>${x.o?`<span class="off">Save ${tk(x.o-x.p)}</span>`:`<span class="off">Combo offer</span>`}<div class="row" style="padding:0"><select aria-label="Size">${["S","M","L","XL"].map(s=>`<option>${s}</option>`).join("")}</select><button class="add" data-id="${x.id}">Add to cart</button></div></div></article>`).join("")}
function draw(){
 $("#cnt").textContent=cart.reduce((a,b)=>a+b.q,0);
 $("#items").innerHTML=cart.length?cart.map((l,k)=>{const x=P.find(y=>y.id==l.id);return `<div class="item"><img src="${x.i}" alt=""><div class="t">${x.n}<br><small>Size ${l.s} · ${tk(x.p)}</small></div><div class="q"><button data-m="${k}" aria-label="Less">−</button> ${l.q} <button data-pl="${k}" aria-label="More">+</button></div></div>`}).join(""):"<p>Your cart is empty. Add a product to start.</p>";
 const sub=cart.reduce((a,l)=>a+P.find(y=>y.id==l.id).p*l.q,0);
 $("#sum").innerHTML=cart.length?`<div><span>Subtotal</span><span>${tk(sub)}</span></div><div><span>Delivery charge</span><span>${tk(DEL)}</span></div><div class="tot"><span>Total</span><span>${tk(sub+DEL)}</span></div>`:"";
 $("#f").style.display=cart.length?"grid":"none"}
document.addEventListener("click",e=>{const t=e.target;
 if(t.dataset.c){cat=t.dataset.c;tabs();grid()}
 if(t.dataset.id){const s=t.parentNode.querySelector("select").value,id=+t.dataset.id,l=cart.find(l=>l.id==id&&l.s==s);l?l.q++:cart.push({id,s,q:1});draw();$("#drawer").classList.add("open")}
 if(t.dataset.m){const l=cart[+t.dataset.m];if(--l.q<1)cart.splice(+t.dataset.m,1);draw()}
 if(t.dataset.pl){cart[+t.dataset.pl].q++;draw()}});
$("#open").onclick=()=>$("#drawer").classList.add("open");
$("#close").onclick=()=>$("#drawer").classList.remove("open");
tabs();grid();draw();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getDatabase,ref,get,set,update,push,onValue,query,orderByChild,remove} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const app=initializeApp({apiKey:"AIzaSyCrWnK7nwci44imvE9_2DmXiJg1L6i0LOU",authDomain:"innerbeauty-414f8.firebaseapp.com",databaseURL:"https://innerbeauty-414f8-default-rtdb.firebaseio.com",projectId:"innerbeauty-414f8",storageBucket:"innerbeauty-414f8.firebasestorage.app",messagingSenderId:"278889412006",appId:"1:278889412006:web:f7ddfb2aebc93d249bcb67"});
const auth=getAuth(app),db=getDatabase(app),R=p=>ref(db,p),ADMIN="xinner",MAIL=u=>u.toLowerCase()+"@innerbeauty.app";
let me=null,admin=false,unsubs=[],pk="",pend=false,lo=null,pT=0,rq=false,iv=0;const ld=$("#ld");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ST={placed:"Order placed. Confirm payment to continue",awaiting_payment:"Waiting for payment",submitted:"Payment submitted. Waiting for admin to confirm",confirmed:"Order confirmed"};
const PAY_MS=6e5,RQ="Payment time is over. Please send me the payment info again.",left=()=>Math.min(PAY_MS,pT+PAY_MS-Date.now()),fmt=r=>Math.floor(r/6e4)+":"+String(Math.floor(r%6e4/1e3)).padStart(2,"0");
const dt=t=>new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const orderText=o=>`New order – innerBeauty\n`+o.items.map(l=>`${l.q} x ${l.n} (Size ${l.s}) = ${l.p*l.q} tk`).join("\n")+`\nSubtotal: ${o.sub} tk\nDelivery: ${o.del} tk\nTotal: ${o.total} tk\n\nName: ${o.name}\nAddress: ${o.address}`;
const shrink=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,640/i.width),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);let d=c.toDataURL("image/jpeg",.6);if(d.length>180000)d=c.toDataURL("image/jpeg",.35);ok(d)};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(f)});
const say=(oid,from,text)=>push(R("orders/"+oid+"/msgs"),{from,text,t:Date.now()});
function stop(){unsubs.forEach(f=>f());unsubs=[];pk="";clearInterval(iv);pT=0;rq=false;lo=null}
function sync(u){me=u;admin=!!u&&u.email==MAIL(ADMIN);$("#lg").textContent=u?"Logout":"Login";$("#adm").hidden=!admin;$("#ord").hidden=true;
 if(u&&!admin)get(R("orders/"+u.uid)).then(s=>{$("#ord").hidden=!s.exists()}).catch(()=>{});
 if(u&&!admin&&!$("#n").value)$("#n").value=u.email.split("@")[0]}
onAuthStateChanged(auth,sync);
$("#lg").onclick=async()=>{if(me){await signOut(auth);stop();$("#chat").classList.remove("open","wide");return}$("#le").textContent="";ld.showModal()};
$("#lx").onclick=()=>ld.close();
$("#lf").onsubmit=async e=>{e.preventDefault();const mode=e.submitter?.value||"login",u=$("#lu").value.trim(),p=$("#lp").value,er=$("#le");
 if(!/^[a-z0-9_]{3,20}$/i.test(u)){er.textContent="Username must be 3–20 letters, numbers or underscore.";return}
 if(p.length<6){er.textContent="Password must be at least 6 characters.";return}
 try{if(mode=="signup"){if(u.toLowerCase()==ADMIN){er.textContent="This username is not available.";return}
   const c=await createUserWithEmailAndPassword(auth,MAIL(u),p);await set(R("users/"+c.user.uid),{name:u,t:Date.now()})}
  else await signInWithEmailAndPassword(auth,MAIL(u),p);
  sync(auth.currentUser);$("#lp").value="";ld.close();if(admin)dash();else if(pend){pend=false;$("#f").requestSubmit()}}
 catch(x){er.textContent=({"auth/email-already-in-use":"This username is taken.","auth/invalid-credential":"Wrong username or password.","auth/network-request-failed":"No connection. Please try again."})[x.code]||"Something went wrong. Please try again."}};
$("#f").onsubmit=async e=>{e.preventDefault();if(!me){pend=true;$("#le").textContent="Please login to place your order.";ld.showModal();return}
 const n=$("#n").value.trim(),a=$("#a").value.trim();if(!n||!a){$("#err").textContent="Enter your name and your full address.";return}$("#err").textContent="";
 const items=cart.map(l=>{const x=P.find(y=>y.id==l.id);return{n:x.n,s:l.s,q:l.q,p:x.p}}),sub=items.reduce((s,l)=>s+l.p*l.q,0);
 try{await set(R("orders/"+me.uid),{uid:me.uid,name:n,address:a,items,sub,del:DEL,total:sub+DEL,status:"placed",formReq:false,t:Date.now()});
  cart=[];draw();$("#drawer").classList.remove("open");$("#ord").hidden=false;openChat(me.uid)}
 catch(x){$("#err").textContent="Could not place the order. Please try again."}};
function openChat(oid){stop();const role=admin&&oid!=me.uid?"admin":"user";$("#chat").classList.remove("wide");
 $("#cbody").innerHTML=`${role=="admin"?'<button class="add" id="bk" style="padding:6px 12px;width:auto">← Dashboard</button>':""}<h2 style="font-size:30px;margin:8px 0">${role=="admin"?"Customer order":"Your order"}</h2><div id="hd"></div><div class="msgs" id="ms" aria-live="polite"></div><div id="pf"></div><div class="row" id="mr"><input id="mi" placeholder="Type a message" aria-label="Message"><button class="add" id="sd" style="flex:0 0 80px">Send</button></div>`;
 $("#chat").classList.add("open");if($("#bk"))$("#bk").onclick=dash;
 unsubs.push(onValue(R("orders/"+oid),s=>hd(s.val(),oid,role)));
 unsubs.push(onValue(query(R("orders/"+oid+"/msgs"),orderByChild("t")),s=>{let h="";pT=0;rq=false;s.forEach(c=>{const m=c.val();if(m.from=="admin"&&/^Please pay /.test(m.text)){pT=m.t;rq=false}if(m.from=="user"&&m.text==RQ)rq=true;h+=`<div class="m ${(m.from=="admin")==(role=="admin")?"me":""}">${esc(m.text)}</div>`});$("#ms").innerHTML=h;$("#ms").scrollTop=1e9;pform(oid,role)}));
 const send=async()=>{const t=$("#mi").value.trim();if(!t)return;$("#mi").value="";await say(oid,role,t)};
 $("#sd").onclick=send;$("#mi").onkeydown=e=>{if(e.key=="Enter")send()};
 iv=setInterval(()=>{if(!$("#tm"))return;if(left()<=0)pform(oid,role);else $("#tm").textContent=fmt(left())},1e3)}
function hd(o,oid,role){if(!o||!$("#hd"))return;lo=o;
 let h=`<div class="box"><span class="st">${ST[o.status]}</span><small>${o.items.map(l=>`${l.q}× ${esc(l.n)} (${esc(l.s)})`).join(", ")}</small><b>Total ${tk(o.total)} (includes ${tk(o.del)} delivery)</b><small>${esc(o.name)} · ${esc(o.address)}</small></div>`;
 if(role=="user"&&o.status=="placed")h+=`<button class="cartbtn" id="pc">Payment confirm</button>`;
 if(role=="admin"&&o.status=="submitted")h+=`<button class="cartbtn" id="cf">Confirm payment</button>`;
 if(role=="admin"&&o.status=="awaiting_payment")h+=`<div class="box"><select id="pmd" aria-label="Method">${["bKash","Nagad"].map(x=>`<option${o.payMethod==x?" selected":""}>${x}</option>`).join("")}</select><select id="ptp" aria-label="Payment type">${["Send Money","Payment","Cash Out"].map(x=>`<option${o.payType==x?" selected":""}>${x}</option>`).join("")}</select><input id="pt" placeholder="Number to pay to" inputmode="tel" value="${esc(o.payTo||"")}" aria-label="Number to pay to"><button class="cartbtn" id="sf">${o.formReq?"Update payment form":"Send payment form"}</button></div>`;
 if(o.payment)h+=`<div class="box"><b>Payment details</b><span>${esc(o.payment.method)} · paid from ${esc(o.payment.from)} · Transaction ID ${esc(o.payment.trx)}</span>${o.payment.shot?`<img class="sh" src="${o.payment.shot}" alt="Payment screenshot">`:""}</div>`;
 $("#hd").innerHTML=h;const hide=role=="user"&&o.status=="placed";$("#ms").style.display=$("#mr").style.display=hide?"none":"";
 if($("#pc"))$("#pc").onclick=async()=>{await say(oid,"user",orderText(o));await update(R("orders/"+oid),{status:"awaiting_payment"})};
 if($("#sf"))$("#sf").onclick=async()=>{const pt=$("#pt").value.trim(),pmd=$("#pmd").value,ptp=$("#ptp").value;if(!pt)return;await update(R("orders/"+oid),{formReq:true,payTo:pt,payMethod:pmd,payType:ptp});await say(oid,"admin",`Please pay ${tk(o.total)} by ${pmd} ${ptp} to ${pt}, then fill in the payment form below.`)};
 if($("#cf"))$("#cf").onclick=async()=>{$("#cf").disabled=true;try{await update(R("orders/"+oid),{status:"confirmed",confirmedAt:Date.now()});await set(R("sales/"+oid+"_"+o.t),{uid:oid,name:o.name,total:o.total,t:Date.now()});await say(oid,"admin","Your payment is confirmed. Your order is confirmed. Thank you!")}catch(x){$("#cf").disabled=false}};

function pform(oid,role){const o=lo;if(!o||!$("#pf"))return;
 const on=role=="user"&&o.formReq&&o.status=="awaiting_payment",ex=on&&pT>0&&left()<=0;
 const key=role+o.formReq+o.status+(o.payTo||"")+(o.payMethod||"")+(o.payType||"")+pT+ex+rq;
 if(key===pk)return;pk=key;
 $("#pf").innerHTML=!on?"":ex?`<div class="box"><b>Payment time is over</b><small>You did not pay within 10 minutes, so the payment method has changed. Please get the payment info again to pay.</small><div class="err" id="pe" role="alert"></div>${rq?"<small>Request sent. Please wait for the new payment info.</small>":'<button class="cartbtn" id="pr">Get payment info again</button>'}</div>`:`<div class="box"><b>Payment form</b>${pT?`<small>Time left to pay: <b id="tm">${fmt(left())}</b></small>`:""}<small>Pay ${tk(o.total)} by ${esc(o.payMethod)} ${esc(o.payType)} to ${esc(o.payTo)}, then fill in this form.</small><input id="pn" placeholder="The number you sent the money from" inputmode="tel" aria-label="The number you sent the money from"><input id="px" placeholder="Transaction ID"><label>Payment screenshot<input id="ps" type="file" accept="image/*"></label><div class="err" id="pe" role="alert"></div><button class="cartbtn" id="pb">Submit payment</button></div>`;
 if($("#pr"))$("#pr").onclick=async()=>{$("#pr").disabled=true;try{await say(oid,"user",RQ)}catch(x){$("#pr").disabled=false;$("#pe").textContent="Could not send. Please try again."}};
 if($("#pb"))$("#pb").onclick=async()=>{if(pT&&left()<=0){pform(oid,role);return}const from=$("#pn").value.trim(),trx=$("#px").value.trim(),f=$("#ps").files[0];
  if(!/^[0-9+\- ]{10,15}$/.test(from)||!trx||!f){$("#pe").textContent="Enter the number, transaction ID and a screenshot.";return}
  try{$("#pb").disabled=true;const shot=await shrink(f),method=o.payMethod||"bKash";
   await update(R("orders/"+oid),{payment:{method,from,trx,shot},status:"submitted"});
   await say(oid,"user",`Payment submitted: ${method}, Transaction ID ${trx}`)}
  catch(x){$("#pb").disabled=false;$("#pe").textContent="Could not submit. Try a smaller screenshot."}}}
function chart(S){const a=Object.values(S).sort((x,y)=>x.t-y.t);if(!a.length)return"<small style='color:#9fb0c0'>The chart appears after the first confirmed order.</small>";
 let c=0;const p=[{t:a[0].t-36e5,v:0},...a.map(s=>({t:s.t,v:c+=+s.total}))],W=640,H=240,l=52,r=70,tp=14,b=26,mx=c,t0=p[0].t,t1=p[p.length-1].t;
 const X=t=>l+(t-t0)/(t1-t0)*(W-l-r),Y=v=>tp+(1-v/mx)*(H-tp-b),d=p.map((q,i)=>`${i?"L":"M"}${X(q.t).toFixed(1)},${Y(q.v).toFixed(1)}`).join("");
 let g="";for(let i=0;i<=4;i++){const v=mx*i/4,y=Y(v);g+=`<line x1="${l}" x2="${W-r}" y1="${y}" y2="${y}" stroke="#223040"/><text x="${l-6}" y="${y+4}" fill="#9fb0c0" font-size="11" text-anchor="end">${Math.round(v)}</text>`}
 const ly=Y(c);return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Income over time">${g}<path d="${d}L${X(t1)},${Y(0)}L${X(t0)},${Y(0)}Z" fill="#16a34a" opacity=".18"/><path d="${d}" fill="none" stroke="#22c55e" stroke-width="2.5"/><line x1="${l}" x2="${W-r}" y1="${ly}" y2="${ly}" stroke="#22c55e" stroke-dasharray="3 3"/><rect x="${W-r+2}" y="${ly-11}" width="64" height="22" rx="4" fill="#22c55e"/><text x="${W-r+34}" y="${ly+4}" font-size="12" font-weight="700" fill="#052e16" text-anchor="middle">৳${c}</text><text x="${l}" y="${H-6}" font-size="11" fill="#9fb0c0">${dt(a[0].t)}</text><text x="${W-r}" y="${H-6}" font-size="11" fill="#9fb0c0" text-anchor="end">${dt(t1)}</text></svg>`}
function dash(){stop();$("#chat").classList.add("open","wide");
 $("#cbody").innerHTML=`<h2 style="font-size:34px">Dashboard</h2><div class="stats" id="st"></div><div class="box"><b>Income</b><div class="ch" id="ch"></div></div><div class="box"><b>Orders</b><div class="ol" id="ol" style="flex-direction:column"></div></div><div class="box"><b>Accounts</b><div id="ul"></div></div>`;
 let U={},O={},S={};const paint=()=>{const sv=Object.values(S),inc=sv.reduce((s,x)=>s+ +x.total,0),ov=Object.entries(O).sort((x,y)=>y[1].t-x[1].t);
  $("#st").innerHTML=[["Accounts",Object.keys(U).length],["Orders confirmed",sv.length],["Income",tk(inc)],["Payments to review",ov.filter(x=>x[1].status=="submitted").length],["Pending orders",ov.filter(x=>x[1].status!="confirmed").length]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${x[1]}</b></div>`).join("");
  $("#ch").innerHTML=chart(S);
  $("#ol").innerHTML=ov.length?ov.map(([k,o])=>`<div style="display:flex;gap:6px;width:100%"><button data-o="${esc(k)}" style="text-align:left;flex:1">${esc(o.name)} · ${tk(o.total)}<br><small>${ST[o.status]}</small></button><button data-del="${esc(k)}" aria-label="Delete order" style="color:#d33;border-color:#d33">Delete</button></div>`).join(""):"No orders yet.";
  const us=Object.values(U).sort((x,y)=>y.t-x.t);$("#ul").innerHTML=us.length?us.map(u=>`<div class="item"><span class="t">${esc(u.name)}</span><small>${dt(u.t)}</small></div>`).join(""):"No accounts yet."};
 unsubs.push(onValue(R("users"),s=>{U=s.val()||{};paint()}),onValue(R("orders"),s=>{O=s.val()||{};paint()}),onValue(R("sales"),s=>{S=s.val()||{};paint()}));
 $("#ol").onclick=async e=>{const b=e.target.closest("[data-del]");if(!b)return;const k=b.dataset.del,o=O[k];if(!o||!confirm("Delete this order ("+o.name+", "+tk(o.total)+")? If it was confirmed, its amount will also be removed from income."))return;
  b.disabled=true;try{await remove(R("orders/"+k));for(const [sk,sv] of Object.entries(S))if(sv.uid==k)await remove(R("sales/"+sk))}catch(x){b.disabled=false;alert("Could not delete. Please try again.")}}}
